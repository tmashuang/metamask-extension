name: Node.js CI

on: pull_request

jobs:
  build:
    strategy:
      matrix:
        node-version: [16.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - run: yarn
    - name: TestCoverage
      id: testCoverage
      uses: anuraag016/Jest-Coverage-Diff@master
      with:
        fullCoverageDiff: false
        runCommand: "npx jest --collectCoverageFrom='[\"'<rootDir>/app/scripts/controllers/permissions/**/*.js','<rootDir>/app/scripts/lib/createRPCMethodTrackingMiddleware.js','<rootDir>/shared/**/*.js','<rootDir>/ui/**/*.js',\"]' --coverage --collectCoverage=true --coverageDirectory='./jest-coverage/main' --coverageReporters='json-summary' --forceExit"
        delta: 0.5